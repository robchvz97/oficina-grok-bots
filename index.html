<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oficina · Frutos Chávez</title>
<style>
  :root {
    --ink: #1c1915;
    --paper: #f4efe6;
    --line: rgba(28,25,21,.12);
    --mango: #e07a2f;
    --pina: #d4a017;
    --mora: #7b4b8a;
    --verde: #3d7a52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14120f; color: var(--paper); font-family: "Segoe UI", "Avenir Next", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 2;
    width: min(340px, calc(100vw - 32px));
    background: rgba(244,239,230,.94);
    color: var(--ink);
    border-radius: 16px;
    padding: 14px 14px 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.28);
    backdrop-filter: blur(8px);
  }
  #hud h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  #hud p.sub { margin: 0 0 10px; font-size: 12px; opacity: .7; }
  .bot {
    display: grid; grid-template-columns: 10px 1fr; gap: 8px;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
  label { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin-bottom: 3px; }
  input, select {
    width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
  }
  .row { display: grid; grid-template-columns: 1.1fr .9fr; gap: 6px; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 2; font-size: 12px; letter-spacing: .04em;
    background: rgba(20,18,15,.72); padding: 8px 12px; border-radius: 999px;
    color: #f4efe6;
  }
  #clock {
    position: fixed; top: 16px; right: 16px; z-index: 2;
    font-variant-numeric: tabular-nums; font-size: 13px;
    background: rgba(20,18,15,.55); padding: 8px 12px; border-radius: 999px;
  }
  button.link {
    margin-top: 8px; border: 0; background: transparent; color: #6b4b2a;
    font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline;
  }
</style>
</head>
<body>
<div id="hud">

  <p class="sub" id="live">Buscando señal…</p>
  <div id="roster"></div>
  <button class="link" id="probar" type="button">Probar señal</button>
  <button class="link" id="reset" type="button">Vaciar la sala</button>
</div>
<div id="clock"></div>
<div id="hint">WASD para caminar · mouse para mirar · rueda para alejar la camara</div>
<script src="three.min.js"></script>
<script>
const DEFAULTS = [
  { id: "b1", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0xe07a2f, accent: "#e07a2f" },
  { id: "b2", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0xd4a017, accent: "#d4a017" },
  { id: "b3", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0x7b4b8a, accent: "#7b4b8a" },
  { id: "b4", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0x3d7a52, accent: "#3d7a52" }
];
const STATUSES = [
  ["trabajando", "Trabajando en el escritorio"],
  ["caminando", "Caminando por la oficina"],
  ["pensando", "Pensando / revisando"],
  ["hablando", "Hablando con el equipo"],
  ["esperando", "Esperando tu aprobación"],
  ["descanso", "En descanso"]
];

function loadBots() {
  try {
    const raw = localStorage.getItem("oficina-frutos-bots");
    if (!raw) return DEFAULTS.map(b => ({ ...b }));
    const saved = JSON.parse(raw);
    return DEFAULTS.map(b => ({ ...b, ...(saved.find(s => s.id === b.id) || {}) }));
  } catch (e) {
    return DEFAULTS.map(b => ({ ...b }));
  }
}
let bots = loadBots();
function save() {
  localStorage.setItem("oficina-frutos-bots", JSON.stringify(bots.map(b => ({
    id: b.id, name: b.name, role: b.role, status: b.status
  }))));
}

const roster = document.getElementById("roster");
function renderRoster() {
  roster.innerHTML = "";
  bots.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "bot";
    el.innerHTML = `
      <div class="dot" style="background:${b.accent}"></div>
      <div>
        <div class="row">
          <div><label>Nombre</label><input data-i="${i}" data-k="name" value="${escapeHtml(b.name)}" /></div>
          <div><label>Puesto</label><input data-i="${i}" data-k="role" value="${escapeHtml(b.role)}" /></div>
        </div>
        <label style="margin-top:6px">Estado</label>
        <select data-i="${i}" data-k="status">
          ${STATUSES.map(([v, label]) => `<option value="${v}" ${b.status === v ? "selected" : ""}>${label}</option>`).join("")}
        </select>
      </div>`;
    roster.appendChild(el);
  });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
}
renderRoster();
roster.addEventListener("input", onEdit);
roster.addEventListener("change", onEdit);
function onEdit(ev) {
  const t = ev.target;
  if (!t.dataset) return;
  const i = Number(t.dataset.i);
  const k = t.dataset.k;
  if (!bots[i] || !k) return;
  bots[i][k] = t.value;
  save();
  if (actors[i]) actors[i].setLabel();
}

  localStorage.removeItem("oficina-frutos-bots");

const live = document.getElementById("live");
let lastSig = "";
let since = Math.floor(Date.now() / 1000) - 3600;
function applyRemote(list) {
  if (!Array.isArray(list) || !list.length) return;
  const sig = JSON.stringify(list);
  if (sig === lastSig) return;
  lastSig = sig;
  list.slice(0, 4).forEach((remote) => {
    const name = String(remote.name || "").trim();
    if (!name) return;
    let slot = bots.find((b) => b.name.toLowerCase() === name.toLowerCase());
    if (!slot) slot = bots.find((b) => b.name === "Sin conectar");
    if (!slot) slot = bots[0];
    slot.name = name;
    slot.role = remote.task || remote.role || slot.role;
    slot.status = remote.status || "trabajando";
    slot.task = remote.task || "";
  });
  save();
  renderRoster();
  actors.forEach(a => a.setLabel());
}
async function pull() {
  try {
    const res = await fetch(NTFY + "/json?poll=1&since=" + since);
    if (!res.ok) throw new Error("sin canal");
    const text = await res.text();
    const found = [];
    text.split("\n").forEach(line => {
      if (!line.trim()) return;
      try {
        const msg = JSON.parse(line);
        since = Math.max(since, (msg.time || 0) + 1);
        if (msg.event !== "message") return;
        const payload = JSON.parse(msg.message);
        if (payload && payload.name) found.push(payload);
      } catch (err) {}
    });
    if (found.length) {
      const byName = new Map();
      found.forEach(item => byName.set(String(item.name).toLowerCase(), item));
      applyRemote([...byName.values()]);
    }
    live.textContent = lastSig
      ? "En vivo, conectado a tus bots."
      : "Página lista. En cuanto un bot avise, ocupa su escritorio.";
  } catch (e) {
    live.textContent = "Sin señal del canal. Recarga en unos segundos.";
  }
}

function makeLabel(text) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 160;
  const ctx = c.getContext("2d");
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.7, 0.53, 1);
  sprite.userData = { ctx, tex, c };
  paintLabel(sprite, text, "");
  return sprite;
}
function paintLabel(sprite, name, role) {
  const { ctx, tex, c } = sprite.userData;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = "rgba(28,25,21,0.82)";
  roundRect(ctx, 16, 18, 480, 124, 28);
  ctx.fill();
  ctx.fillStyle = "#f4efe6";
  ctx.font = "700 48px Segoe UI, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(String(name || "Bot").slice(0, 16), 256, 72);
  ctx.font = "400 26px Segoe UI, sans-serif";
  ctx.fillStyle = "#e7d3b0";
  ctx.fillText(String(role || "").slice(0, 32), 256, 112);
  tex.needsUpdate = true;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

  const pupil = new THREE.MeshStandardMaterial({ color: 0x2a211c });
  function eye(x) {
    const e = new THREE.Group();
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), eyeWhite);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 8), pupil);
    p.position.z = 0.02;
    e.add(w, p);
    e.position.set(x, 1.4, 0.13);
    return e;
  }
  const features = {
    nigoo: new THREE.Group(),
    muller: new THREE.Group(),
    gori: new THREE.Group(),
    gustav: new THREE.Group()
  };
  const hairMat = {
    nigoo: new THREE.MeshStandardMaterial({ color: 0x2a2118 }),
    muller: new THREE.MeshStandardMaterial({ color: 0x6a4632 }),
    gori: new THREE.MeshStandardMaterial({ color: 0x6b4a30 })
  };
  function puff(group, mat, x, y, z, r) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat);
    m.position.set(x, y, z);
    group.add(m);
  }
  puff(features.nigoo, hairMat.nigoo, 0, 1.5, 0, 0.1);
  puff(features.nigoo, hairMat.nigoo, -0.09, 1.46, 0.02, 0.07);
  puff(features.nigoo, hairMat.nigoo, 0.09, 1.46, 0.02, 0.07);
  puff(features.nigoo, hairMat.nigoo, 0, 1.44, -0.08, 0.08);
  puff(features.nigoo, hairMat.nigoo, 0, 1.28, 0.1, 0.07);
  puff(features.nigoo, hairMat.nigoo, -0.06, 1.26, 0.08, 0.05);
  puff(features.nigoo, hairMat.nigoo, 0.06, 1.26, 0.08, 0.05);
  puff(features.muller, hairMat.muller, 0, 1.52, 0, 0.11);
  puff(features.muller, hairMat.muller, -0.1, 1.46, 0.04, 0.07);
  puff(features.muller, hairMat.muller, 0.1, 1.48, 0.02, 0.08);
  puff(features.muller, hairMat.muller, 0.04, 1.5, -0.06, 0.07);
  const goriCap = new THREE.Mesh(new THREE.SphereGeometry(0.155, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.48), hairMat.gori);
  goriCap.position.y = 1.42;
  features.gori.add(goriCap);
  const glass = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  function lens(x) {
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.008, 8, 16), glass);
    r.position.set(x, 1.4, 0.15);
    return r;
  }
  features.gustav.add(lens(-0.05), lens(0.05));
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.008, 0.008), glass);
  bridge.position.set(0, 1.4, 0.15);
  features.gustav.add(bridge);
  Object.values(features).forEach(group => { group.visible = false; g.add(group); });
  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.28, 4, 10), cloth);
  const legR = legL.clone();
  legL.position.set(-0.08, 0.46, 0);
  legR.position.set(0.08, 0.46, 0);
  const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.24, 4, 10), shirt);
  const armR = armL.clone();
  armL.position.set(-0.24, 0.98, 0);
  armR.position.set(0.24, 0.98, 0);
  g.add(body, neck, head, eye(-0.055), eye(0.055), legL, legR, armL, armR);
  g.userData.limbs = { legL, legR, armL, armR, body };
  g.userData.head = head;
  g.userData.neck = neck;
  g.userData.shirt = shirt;
  g.userData.skin = skinM;
  g.userData.features = features;
  return g;
}

const home = desks.map(d => ({
  x: d.x,
  z: d.z + (d.rot === 0 ? 0.7 : -0.7),
  rot: d.rot
}));
const coffee = { x: 0.9, z: 0.2 };

const actors = bots.map((b, i) => {
  const person = makePerson(b.color);
  person.position.set(home[i].x, 0, home[i].z);
  person.rotation.y = home[i].rot;
  scene.add(person);
  const label = makeLabel(b.name);
  label.position.set(0, 1.95, 0);
  person.add(label);
  const bubble = makeBubble();
  bubble.position.set(0.35, 1.55, 0);
  person.add(bubble);
  return {
    bot: b,
    person,
    label,
    bubble,
    home: home[i],
    phase: i * 1.3,
    setLabel() { paintLabel(label, b.name, b.role); setFace(this); }
  };
});
const SKIN = { nigoo: 0xc68642, muller: 0xe8c4a2, gori: 0xf0c7a4, gustav: 0xe8c4a0 };
function setFace(actor) {
  const key = String(actor.bot.name || "").toLowerCase();
  const look = LOOKS[key];
  const shirt = actor.person.userData.shirt;
  const skin = actor.person.userData.skin;
  const features = actor.person.userData.features || {};
  if (look && shirt) shirt.color.setHex(look.shirt);
  if (skin && SKIN[key]) skin.color.setHex(SKIN[key]);
  Object.keys(features).forEach(name => { features[name].visible = name === key; });
}
function makeBubble() {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  const ctx = c.getContext("2d");
  const tex = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(0.42, 0.42, 1);
  s.userData = { ctx, tex, c };
  return s;
}
function paintBubble(sprite, emoji, on) {
  const { ctx, tex, c } = sprite.userData;
  ctx.clearRect(0, 0, 128, 128);
  if (on) {
    ctx.fillStyle = "rgba(255,250,242,0.94)";
    ctx.beginPath();
    ctx.arc(64, 58, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = "42px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(emoji, 64, 72);
  }
  tex.needsUpdate = true;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let focus = null;
let yaw = 0.55, pitch = 0.62, dist = 13.5;
let dragging = false, lx = 0, ly = 0;
const keys = {};
const player = { x: 0, z: 5.2, yaw: 0.2, pitch: 0.2 };
let walking = false;
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

renderer.domElement.addEventListener("pointerdown", e => {
  dragging = true; lx = e.clientX; ly = e.clientY;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(actors.map(a => a.person), true);
  if (hits[0]) {
    focus = actors.find(a => a.person === hits[0].object || a.person.children.includes(hits[0].object) || isDesc(a.person, hits[0].object));
  }
});
function isDesc(root, obj) {
  let p = obj;
  while (p) { if (p === root) return true; p = p.parent; }
  return false;
}
window.addEventListener("pointerup", () => dragging = false);
window.addEventListener("pointermove", e => {
  if (!dragging) return;
  yaw -= (e.clientX - lx) * 0.005;
  player.yaw -= (e.clientX - lx) * 0.005;
  pitch = Math.max(0.25, Math.min(1.15, pitch + (e.clientY - ly) * 0.004));
  player.pitch = Math.max(-0.4, Math.min(0.8, player.pitch + (e.clientY - ly) * 0.004));
  lx = e.clientX; ly = e.clientY;
});
window.addEventListener("wheel", e => {
  dist = Math.max(6, Math.min(22, dist + e.deltaY * 0.01));
}, { passive: true });
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleString("es-MX", { hour: "2-digit", minute: "2-digit", weekday: "short" });
}
tickClock();
setInterval(tickClock, 15000);


let restPlan = { at: -99, key: "", map: {} };
function planRest(resting, t) {
  const key = resting.map(x => x.bot.name).sort().join("|");
  if (restPlan.key === key && t - restPlan.at < 28) return restPlan.map;
  const names = resting.map(x => x.bot.name);
  for (let n = names.length - 1; n > 0; n--) {
    const j = Math.floor(Math.random() * (n + 1));
    const tmp = names[n];
    names[n] = names[j];
    names[j] = tmp;
  }
  const acts = ["sleep", "play", "chat", "ping"];
  const map = {};
  names.forEach(name => { map[name] = acts[Math.floor(Math.random() * acts.length)]; });
  restPlan = { at: t, key: key, map: map };
  return map;
}
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const forward = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  const strafe = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  if (forward || strafe) walking = true;
  if (walking) {
    const speed = 0.09;
    player.x += Math.sin(player.yaw) * forward * speed + Math.cos(player.yaw) * strafe * speed;
    player.z += Math.cos(player.yaw) * forward * speed - Math.sin(player.yaw) * strafe * speed;
    player.x = Math.max(-7.2, Math.min(7.2, player.x));
    player.z = Math.max(-6.2, Math.min(6.2, player.z));
    camera.position.set(player.x, 1.55, player.z);
    camera.lookAt(player.x + Math.sin(player.yaw), 1.45 - player.pitch * 0.6, player.z + Math.cos(player.yaw));
  } else {
    const target = focus ? focus.person.position : new THREE.Vector3(0, 0.8, 0);
    const camTarget = target.clone();
    camTarget.y = 1.1;
    camera.position.x = camTarget.x + Math.sin(yaw) * dist * Math.cos(pitch * 0.35);
    camera.position.z = camTarget.z + Math.cos(yaw) * dist * Math.cos(pitch * 0.35);
    camera.position.y = 1.4 + dist * Math.sin(pitch) * 0.45;
    camera.lookAt(camTarget);
  }

  actors.forEach((a, i) => {
    const status = a.bot.status;
    const limbs = a.person.userData.limbs;
    const home = a.home;
    let tx = home.x, tz = home.z, trot = home.rot;
    let emoji = "💻", show = true;
    let pose = "stand";
    if (status === "caminando") {
      const ang = t * 0.45 + a.phase;
      tx = Math.cos(ang) * 2.4;
      tz = Math.sin(ang) * 1.6;
      trot = ang + Math.PI / 2;
      emoji = "🚶";
    } else if (status === "hablando") {
      tx = (i % 2 === 0 ? -0.7 : 0.7);
      tz = 0.15;
      trot = i % 2 === 0 ? 0.4 : -0.4;
      emoji = "💬";
    } else if (status === "descanso") {
      const resting = actors.filter(x => x.bot.status === "descanso" && x.bot.name !== "Sin conectar");
      const plan = planRest(resting, t);
      const mode = plan[a.bot.name] || "chat";
      const same = resting.filter(x => plan[x.bot.name] === mode);
      const si = Math.max(0, same.indexOf(a));
      if (mode === "ping") {
        const count = same.length;
        const side = count <= 2 ? (si === 0 ? -1 : 1) : (si < 2 ? -1 : 1);
        const lane = count <= 2 ? 0 : (si % 2 === 0 ? -0.42 : 0.42);
        tx = lane;
        tz = 0.4 + side * 1.75;
        trot = side < 0 ? 0 : Math.PI;
        emoji = "🏓";
        pose = "ping";
        const ballZ = 0.4 + Math.sin(t * 2.2) * 0.95;
        pingBall.position.set(Math.sin(t * 2.2) * 0.25, 0.95 + Math.abs(Math.cos(t * 2.2)) * 0.18, ballZ);
      } else if (mode === "sleep") {
        tx = -1.2 + si * 1.3; tz = 2.4; trot = Math.PI; emoji = "💤"; pose = "sleep";
      } else if (mode === "play") {
        const ang = t * 1.3 + si * 2.1;
        tx = 4.2 + Math.cos(ang) * (1.05 + si * 0.35);
        tz = 3.4 + Math.sin(ang) * 0.8;
        trot = ang + Math.PI / 2;
        emoji = "⚽";
        pose = "play";
        officeBall.position.x = 4.2 + Math.cos(ang + 0.8) * 0.55;
        officeBall.position.z = 3.4 + Math.sin(ang + 0.8) * 0.4;
        officeBall.position.y = 0.18 + Math.abs(Math.sin(t * 3)) * 0.25;
      } else {
        const ang = si * (Math.PI * 2 / Math.max(same.length, 1));
        tx = -3.4 + Math.cos(ang) * 0.7;
        tz = 4.3 + Math.sin(ang) * 0.55;
        trot = Math.atan2(-Math.cos(ang), -Math.sin(ang));
        emoji = "😄";
        pose = "chat";
      }
    } else if (status === "pensando") {
      emoji = "💡";
    } else if (status === "esperando") {
      emoji = "✋";
    }
    if (pose !== "ping") {
      tx += ((i % 2) - 0.5) * 0.15;
      tz += (i - 1.5) * 0.12;
    }
    a.person.position.x += (tx - a.person.position.x) * 0.04;
    a.person.position.z += (tz - a.person.position.z) * 0.04;
    const dy = trot - a.person.rotation.y;
    a.person.rotation.y += Math.atan2(Math.sin(dy), Math.cos(dy)) * 0.08;

    const moving = Math.hypot(tx - a.person.position.x, tz - a.person.position.z) > 0.08 || status === "caminando";
    const swing = moving ? Math.sin(t * 7 + a.phase) * 0.55 : Math.sin(t * 1.5 + a.phase) * 0.08;
    a.person.rotation.z += (0 - a.person.rotation.z) * 0.2;
    if (pose === "sleep") {
      limbs.legL.rotation.x = 1.2; limbs.legR.rotation.x = 1.2;
      limbs.armL.rotation.x = -0.4; limbs.armR.rotation.x = -0.4;
      limbs.body.rotation.x = 1.15;
      a.person.position.y = 0.15;
    } else { limbs.body.rotation.x += (0 - limbs.body.rotation.x) * 0.2; }
    if (pose === "play") {
      limbs.legL.rotation.x = Math.sin(t * 8) * 0.9;
      limbs.legR.rotation.x = -Math.sin(t * 8) * 0.9;
      limbs.armL.rotation.x = -1.2; limbs.armR.rotation.x = -0.3;
      a.person.position.y = Math.abs(Math.sin(t * 6 + a.phase)) * 0.2;
    } else if (pose === "chat") {
      limbs.legL.rotation.x = 0; limbs.legR.rotation.x = 0;
      limbs.armL.rotation.x = -0.5 + Math.sin(t * 3 + i) * 0.45;
      limbs.armR.rotation.x = -0.8;
      a.person.position.y = 0;
    } else {
      limbs.legL.rotation.x = swing;
      limbs.legR.rotation.x = -swing;
      limbs.armL.rotation.x = status === "trabajando" ? -0.8 + Math.sin(t * 8 + i) * 0.25 : -swing * 0.7;
      limbs.armR.rotation.x = status === "trabajando" ? -0.8 + Math.sin(t * 8 + i + 1) * 0.25 : swing * 0.7;
      a.person.position.y = moving ? Math.abs(Math.sin(t * 7 + a.phase)) * 0.04 : 0;
    }
    paintBubble(a.bubble, emoji, show);
    a.bubble.position.y = 1.62 + Math.sin(t * 2 + i) * 0.04;
  });
  for (let i = 0; i < actors.length; i++) {
    for (let j = i + 1; j < actors.length; j++) {
      const pa = actors[i].person.position;
      const pb = actors[j].person.position;
      let dx = pa.x - pb.x;
      let dz = pa.z - pb.z;
      let dist2 = Math.hypot(dx, dz);
      const min = 1.05;
      if (dist2 < min) {
        if (dist2 < 0.001) { dx = 0.4; dz = 0.2; dist2 = Math.hypot(dx, dz); }
        const push = (min - dist2) * 0.5;
        pa.x += dx / dist2 * push;
        pa.z += dz / dist2 * push;
        pb.x -= dx / dist2 * push;
        pb.z -= dz / dist2 * push;
      }
    }
  }
  renderer.render(scene, camera);
}
animate();
</script>
