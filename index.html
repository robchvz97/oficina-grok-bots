<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oficina · Frutos Chávez</title>
<style>
  :root {
    --ink: #1c1915;
    --paper: #f4efe6;
    --line: rgba(28,25,21,.12);
    --mango: #e07a2f;
    --pina: #d4a017;
    --mora: #7b4b8a;
    --verde: #3d7a52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14120f; color: var(--paper); font-family: "Segoe UI", "Avenir Next", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 2;
    width: min(340px, calc(100vw - 32px));
    background: rgba(244,239,230,.94);
    color: var(--ink);
    border-radius: 16px;
    padding: 14px 14px 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.28);
    backdrop-filter: blur(8px);
  }
  #hud h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  #hud p.sub { margin: 0 0 10px; font-size: 12px; opacity: .7; }
  .bot.needs-you { outline: 2px solid #e0a020; background: #fff4dc; }
  .needs-tag { color: #9a6a10; font-size: 11px; font-weight: 700; margin-top: 4px; }
  .bot {
    display: grid; grid-template-columns: 10px 1fr; gap: 8px;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
  label { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin-bottom: 3px; }
  input, select {
    width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
  }
  .row { display: grid; grid-template-columns: 1.1fr .9fr; gap: 6px; }
  #clima { position: fixed; left: 16px; bottom: 58px; z-index: 2; color: #f4efe6; font-size: 12px; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #murmur-note { position: fixed; top: 16px; right: 16px; z-index: 2; pointer-events: none; background: rgba(28,25,21,.8); color: #f4efe6; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 2; font-size: 12px; letter-spacing: .04em;
    background: rgba(20,18,15,.72); padding: 8px 12px; border-radius: 999px;
    color: #f4efe6;
  }
  #clock {
    position: fixed; right: 16px; bottom: 58px; z-index: 2; pointer-events: none;
    font-variant-numeric: tabular-nums; font-size: 13px;
    background: rgba(20,18,15,.55); padding: 8px 12px; border-radius: 999px;
  }
  button.link {
    margin-top: 8px; border: 0; background: transparent; color: #6b4b2a;
    font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline;
  }

  #joy, #look { position: fixed; bottom: 28px; width: 128px; height: 128px; border-radius: 50%; background: rgba(28,25,21,0.35); border: 2px solid rgba(255,255,255,0.35); touch-action: none; z-index: 6; }
  #joy { left: 22px; }
  #look { right: 22px; }
  @media (hover: hover) and (pointer: fine) { #joy, #look { display: none; } }
  canvas { touch-action: none; }
  #knob, #look-knob { position: absolute; left: 44px; top: 44px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,250,242,0.9); }

  .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #hud-hide, #hud-show, #hud-refresh, #hud-refresh-out, #voz-btn { border: 0; background: #1c1915; color: #f4efe6; border-radius: 999px; height: 28px; cursor: pointer; }
  #hud-hide, #hud-show, #hud-refresh, #hud-refresh-out { width: 28px; }
  #voz-btn { width: auto; padding: 0 10px; font-size: 12px; }
  #hud-show { position: fixed; top: 16px; left: 16px; z-index: 6; width: auto; padding: 0 12px; }
  #hud-refresh-out { position: fixed; top: 16px; left: 92px; z-index: 6; }
  .hud-top span { display: flex; gap: 6px; }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<button id="hud-show" type="button">Equipo</button>
<button id="hud-refresh-out" type="button" title="Actualizar">↻</button>
<div id="hud" class="hidden">
  <div class="hud-top"><h1>Oficina Frutos Chávez</h1><span><button id="voz-btn" type="button" title="Activar voz">Voz</button><button id="hud-refresh" type="button" title="Actualizar">↻</button><button id="hud-hide" type="button" title="Ocultar">—</button></span></div>
  <p class="sub">Los escritorios estan vacios hasta que tus bots avisen. Pega el aviso en cada uno, con su nombre real.</p>
  <p class="sub" id="live">Buscando señal…</p>
  <div id="roster"></div>
  <p class="sub" id="pedidos-cap">Pedidos</p>
  <textarea id="pedidos" rows="5" placeholder="Un cliente por linea"></textarea>
  <button class="link" id="probar" type="button">Probar señal</button>
  <button class="link" id="probar-sonido" type="button">Probar sonido</button>
  <button class="link" id="reset" type="button">Vaciar la sala</button>
</div>
<div id="clock"></div>
<div id="clima"></div>
<div id="murmur-note" hidden>Murmurando</div>
<div id="look"><div id="look-knob"></div></div>
<div id="joy"><div id="knob"></div></div>
<script src="three.min.js"></script>
<script>
const DEFAULTS = [
  { id: "b1", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0xe07a2f, accent: "#e07a2f" },
  { id: "b2", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0xd4a017, accent: "#d4a017" },
  { id: "b3", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0x7b4b8a, accent: "#7b4b8a" },
  { id: "b4", name: "Sin conectar", role: "Esperando a tu bot", status: "descanso", color: 0x3d7a52, accent: "#3d7a52" }
];
const STATUSES = [
  ["trabajando", "Trabajando en el escritorio"],
  ["caminando", "Caminando por la oficina"],
  ["pensando", "Pensando / revisando"],
  ["hablando", "Hablando con el equipo"],
  ["esperando", "Esperando tu aprobación"],
  ["descanso", "En descanso"]
];

function loadBots() {
  try {
    const raw = localStorage.getItem("oficina-frutos-bots");
    if (!raw) return DEFAULTS.map(b => ({ ...b }));
    const saved = JSON.parse(raw);
    return DEFAULTS.map(b => ({ ...b, ...(saved.find(s => s.id === b.id) || {}) }));
  } catch (e) {
    return DEFAULTS.map(b => ({ ...b }));
  }
}
let bots = loadBots();
function save() {
  localStorage.setItem("oficina-frutos-bots", JSON.stringify(bots.map(b => ({
    id: b.id, name: b.name, role: b.role, status: b.status
  }))));
}

const roster = document.getElementById("roster");
function renderRoster() {
  roster.innerHTML = "";
  bots.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "bot" + (b.status === "esperando" ? " needs-you" : "");
    el.innerHTML = `
      <div class="dot" style="background:${b.accent}"></div>
      <div>
        <div class="row">
          <div><label>Nombre</label><input data-i="${i}" data-k="name" value="${escapeHtml(b.name)}" /></div>
          <div><label>Puesto</label><input data-i="${i}" data-k="role" value="${escapeHtml(b.role)}" /></div>
        </div>
        <label style="margin-top:6px">Estado</label>
        <select data-i="${i}" data-k="status">
          ${STATUSES.map(([v, label]) => `<option value="${v}" ${b.status === v ? "selected" : ""}>${label}</option>`).join("")}
        </select>
        ${b.status === "esperando" ? '<div class="needs-tag">Necesita tu ok</div>' : ""}
      </div>`;
    roster.appendChild(el);
  });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
}
renderRoster();
roster.addEventListener("input", onEdit);
roster.addEventListener("change", onEdit);
function onEdit(ev) {
  const t = ev.target;
  if (!t.dataset) return;
  const i = Number(t.dataset.i);
  const k = t.dataset.k;
  if (!bots[i] || !k) return;
  bots[i][k] = t.value;
  save();
  if (actors[i]) actors[i].setLabel();
  paintScreen(i);
  watchApprovals();
}
document.getElementById("reset").onclick = () => {
  localStorage.removeItem("oficina-frutos-bots");
  bots = DEFAULTS.map(b => ({ ...b, task: "" }));
  save();
  renderRoster();
  

function paintScreen(i, blink) {
  const desk = desks[i];
  const bot = bots[i];
  if (!desk || !desk.display || !bot) return;
  const ctx = desk.display.ctx;
  const waiting = bot.status === "esperando";
  const working = bot.status === "trabajando";
  ctx.fillStyle = waiting ? (blink ? "#f0b429" : "#c9841a") : working ? "#10261c" : "#141816";
  ctx.fillRect(0, 0, 512, 320);
  ctx.fillStyle = waiting ? "#2a2118" : working ? "#7dcea0" : "#8a8175";
  ctx.font = "700 28px Segoe UI, sans-serif";
  ctx.fillText(waiting ? "NECESITA TU OK" : String(bot.name || "Bot").slice(0, 18), 28, 48);
  ctx.fillStyle = waiting ? "#2a2118" : "#f4efe6";
  ctx.font = "400 32px Segoe UI, sans-serif";
  const line = waiting ? (bot.task || "Esperando tu aprobacion") : working ? (bot.task || bot.role || "Trabajando") : "Pantalla en espera";
  wrapText(ctx, String(line), 28, 110, 456, 40);
  desk.display.tex.needsUpdate = true;
}
function wrapText(ctx, text, x, y, max, lh) {
  const words = text.split(" ");
  let line = "";
  let yy = y;
  words.forEach(word => {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > max) {
      ctx.fillText(line, x, yy);
      line = word;
      yy += lh;
    } else line = test;
  });
  ctx.fillText(line, x, yy);
}
actors.forEach(a => a.setLabel());
actors.forEach((a, i) => paintScreen(i));
  fetch("/api/estado", { method: "POST", headers: { "Content-Type": "application/json" }, body: "[]" }).catch(() => {});
};

const joyEl = document.getElementById("joy");
const knob = document.getElementById("knob");
function setJoy(cx, cy, px, py) {
  const dx = px - cx;
  const dy = py - cy;
  const max = 44;
  const len = Math.hypot(dx, dy) || 1;
  const cl = Math.min(max, len);
  const nx = dx / len * cl;
  const ny = dy / len * cl;
  knob.style.left = (44 + nx) + "px";
  knob.style.top = (44 + ny) + "px";
  joy.x = nx / max;
  joy.y = -ny / max;
}
function joyPoint(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = joyEl.getBoundingClientRect();
  setJoy(r.left + r.width / 2, r.top + r.height / 2, t.clientX, t.clientY);
}
joyEl.addEventListener("pointerdown", e => { joyEl.setPointerCapture(e.pointerId); joyPoint(e); e.preventDefault(); });
joyEl.addEventListener("pointermove", e => { if (e.buttons || e.pressure) joyPoint(e); });
function resetJoy() { joy.x = 0; joy.y = 0; knob.style.left = "44px"; knob.style.top = "44px"; }
joyEl.addEventListener("pointerup", resetJoy);
joyEl.addEventListener("pointercancel", resetJoy);

const hud = document.getElementById("hud");
const hudShow = document.getElementById("hud-show");
document.getElementById("hud-hide").onclick = () => { hud.classList.add("hidden"); hudShow.hidden = false; };
document.getElementById("hud-refresh").onclick = () => location.reload();
document.getElementById("hud-refresh-out").onclick = () => location.reload();
hudShow.onclick = () => { hud.classList.remove("hidden"); hudShow.hidden = true; };

const lookEl = document.getElementById("look");
const lookKnob = document.getElementById("look-knob");
const lookJoy = { x: 0, y: 0 };
function setLook(cx, cy, px, py) {
  const dx = px - cx;
  const dy = py - cy;
  const max = 44;
  const len = Math.hypot(dx, dy) || 1;
  const cl = Math.min(max, len);
  lookKnob.style.left = (44 + dx / len * cl) + "px";
  lookKnob.style.top = (44 + dy / len * cl) + "px";
  lookJoy.x = dx / len * cl / max;
  lookJoy.y = dy / len * cl / max;
}
function lookPoint(e) {
  const t = e.touches ? e.touches[0] : e;
  const r = lookEl.getBoundingClientRect();
  setLook(r.left + r.width / 2, r.top + r.height / 2, t.clientX, t.clientY);
}
lookEl.addEventListener("pointerdown", e => { lookEl.setPointerCapture(e.pointerId); lookPoint(e); e.preventDefault(); });
lookEl.addEventListener("pointermove", e => { if (e.buttons || e.pressure) lookPoint(e); });
function resetLook() { lookJoy.x = 0; lookJoy.y = 0; lookKnob.style.left = "44px"; lookKnob.style.top = "44px"; }
lookEl.addEventListener("pointerup", resetLook);
lookEl.addEventListener("pointercancel", resetLook);
const TOPIC = "frutos-chavez-oficina-7f3a9c2e1b84";
const NTFY = "https://ntfy.sh/" + TOPIC;
document.getElementById("probar").onclick = () => {
  fetch(NTFY, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Title": "Pedidos" },
    body: JSON.stringify({ name: "Prueba", role: "Senal", status: "trabajando", task: "Senal de prueba" })
  }).catch(() => {});
};

const live = document.getElementById("live");
let lastSig = "";
let since = Math.floor(Date.now() / 1000) - 3600;
function applyRemote(list) {
  if (!Array.isArray(list) || !list.length) return;
  const sig = JSON.stringify(list);
  if (sig === lastSig) return;
  lastSig = sig;
  list.slice(0, 4).forEach((remote) => {
    const name = String(remote.name || "").trim();
    if (!name) return;
    let slot = bots.find((b) => b.name.toLowerCase() === name.toLowerCase());
    if (!slot) slot = bots.find((b) => b.name === "Sin conectar");
    if (!slot) slot = bots[0];
    slot.name = name;
    slot.role = remote.task || remote.role || slot.role;
    slot.status = remote.status || "trabajando";
    slot.task = remote.task || remote.message || "";
  });
  save();
  renderRoster();
  actors.forEach(a => a.setLabel());
  actors.forEach((a, i) => paintScreen(i));
  watchApprovals();
}
async function pull() {
  try {
    const res = await fetch(NTFY + "/json?poll=1&since=" + since);
    if (!res.ok) throw new Error("sin canal");
    const text = await res.text();
    const found = [];
    text.split("\n").forEach(line => {
      if (!line.trim()) return;
      try {
        const msg = JSON.parse(line);
        since = Math.max(since, (msg.time || 0) + 1);
        if (msg.event !== "message") return;
        const payload = JSON.parse(msg.message);
        if (payload && (Array.isArray(payload.orders) || Array.isArray(payload.names))) {
          const key = payload.date || orderDate().key;
          const orders = Array.isArray(payload.orders)
            ? payload.orders.map(item => ({ name: String(item.name || item.cliente || "").trim(), kg: item.kg, total: item.total != null ? item.total : item.pesos })).filter(item => item.name)
            : payload.names.map(s => ({ name: String(s).trim() })).filter(item => item.name);
          saveOrders(key, orders);
          paintBoard();
        }
        if (payload && (payload.sales != null || payload.total != null)) {
          daySales = Number(payload.sales != null ? payload.sales : payload.total);
          localStorage.setItem("oficina-ventas", String(daySales));
          if (typeof paintSales === "function") paintSales();
        }
        if (payload && payload.name) found.push(payload);
      } catch (err) {}
    });
    if (found.length) {
      const byName = new Map();
      found.forEach(item => byName.set(String(item.name).toLowerCase(), item));
      applyRemote([...byName.values()]);
    }
    live.textContent = lastSig
      ? "En vivo, conectado a tus bots."
      : "Página lista. En cuanto un bot avise, ocupa su escritorio.";
  } catch (e) {
    live.textContent = "Sin señal del canal. Recarga en unos segundos.";
  }
}
pull();
setInterval(pull, 4000);

if (!window.THREE) {
  document.getElementById("live").textContent = "No cargó el motor 3D. Recarga la página.";
  throw new Error("three missing");
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1714);
scene.fog = new THREE.Fog(0x1a1714, 18, 36);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
camera.position.set(8.2, 6.4, 9.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a3228, 0.55));
const sun = new THREE.DirectionalLight(0xffe2b8, 1.15);
sun.position.set(-6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
scene.add(sun);
const fill = new THREE.PointLight(0xffb15a, 0.35, 14);
fill.position.set(0, 2.2, 0);
scene.add(fill);
const lampMat = new THREE.MeshStandardMaterial({ color: 0xf4f1e6, emissive: 0xfff4d2, emissiveIntensity: 0 });
const lamps = [];
[-3.2, 3.2].forEach(x => {

  fixture.position.set(x, 9.35, 0);

  scene.add(glow);
  lamps.push(glow);
});
let weatherDim = 1;
let sunriseHour = 7.4;
let sunsetHour = 19.2;

function box(w, h, d, color, x, y, z, matOpts) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.04, ...(matOpts || {}) })
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function cyl(r, h, color, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, h, 20),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  scene.add(m);
  return m;
}

const marbleA = new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.18, metalness: 0.16 });
const marbleB = new THREE.MeshStandardMaterial({ color: 0xd9d3c8, roughness: 0.2, metalness: 0.12 });
for (let ix = -7; ix <= 7; ix++) {
  for (let iz = -6; iz <= 6; iz++) {
    const tile = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.06, 0.98), (ix + iz) % 2 === 0 ? marbleA : marbleB);

}
box(0.22, 9.6, 14, 0xe7d3b0, -8, 4.8, 0);
box(0.22, 9.6, 14, 0xe7d3b0, 8, 4.8, 0);

const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x9bb7c8, emissiveIntensity: 0.05, roughness: 0.05, metalness: 0.05, transparent: true, opacity: 0.16 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0xd9dde2, metalness: 0.65, roughness: 0.25 });
function pane(w, h, x, y, z, rotY) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat);
  g.position.set(x, y, z);
  g.rotation.y = rotY || 0;
  scene.add(g);
  return g;
}
pane(10.4, 5.6, 0.2, 3.6, -6.7, 0);
const skyCanvas = document.createElement("canvas");
skyCanvas.width = 1024; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext("2d");
const skyTex = new THREE.CanvasTexture(skyCanvas);
const skyMat = new THREE.MeshBasicMaterial({ map: skyTex });
const skyBack = new THREE.Mesh(new THREE.PlaneGeometry(10.6, 5.7), skyMat);
skyBack.position.set(0.2, 3.6, -6.84);
scene.add(skyBack);
const skySide = new THREE.Mesh(new THREE.PlaneGeometry(10.2, 5.5), skyMat);
skySide.position.set(-7.72, 3.5, 0.6);
skySide.rotation.y = Math.PI / 2;
scene.add(skySide);
function paintSky(mode, t) {
  t = t || 0;
  const ctx = skyCtx;
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  if (mode === "rain") { g.addColorStop(0, "#6d7882"); g.addColorStop(1, "#3e4650"); }
  else if (mode === "cloud") { g.addColorStop(0, "#b7c3ce"); g.addColorStop(1, "#8b98a6"); }
  else { g.addColorStop(0, "#7ec8f0"); g.addColorStop(1, "#d7f0ff"); }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);
  if (mode === "clear") {
    ctx.fillStyle = "#ffe38a";
    ctx.beginPath(); ctx.arc(760, 120, 48, 0, Math.PI * 2); ctx.fill();
  }
  const puff = mode === "clear" ? 4 : 9;
  for (let i = 0; i < puff; i++) {
    ctx.fillStyle = mode === "rain" ? "rgba(70,78,86,0.85)" : mode === "cloud" ? "rgba(236,240,244,0.9)" : "rgba(255,255,255,0.85)";
    const x = ((80 + i * 110 + t * (mode === "clear" ? 18 : 10)) % 1200) - 80;
    const y = mode === "clear" ? 300 : 140 + (i % 3) * 70;
    ctx.beginPath(); ctx.ellipse(x, y, 90, 42, 0, 0, Math.PI * 2); ctx.fill();

function orderDate() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  let y = Number(get("year")), m = Number(get("month")), d = Number(get("day")), h = Number(get("hour"));
  const tomorrow = h >= 22;
  if (tomorrow) {
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + 1);
    y = dt.getUTCFullYear(); m = dt.getUTCMonth() + 1; d = dt.getUTCDate();
  }
  const key = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  return { key, tomorrow, label: tomorrow ? "Pedidos de manana" : "Pedidos de hoy" };
}
function loadOrders(key) {
  try { return JSON.parse(localStorage.getItem("oficina-pedidos") || "{}")[key] || []; }
  catch (e) { return []; }
}
function saveOrders(key, names) {
  const all = JSON.parse(localStorage.getItem("oficina-pedidos") || "{}");
  all[key] = names;
  localStorage.setItem("oficina-pedidos", JSON.stringify(all));
}
function paintBoard() {

  ctx.fillStyle = "#f7f1dc";

  ctx.strokeStyle = "#d7c7a2";
  for (let y = 70; y < 900; y += 46) { ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(616, y); ctx.stroke(); }
  ctx.fillStyle = "#2a2118";
  ctx.font = "700 40px Segoe UI, sans-serif";
  ctx.fillText(info.label, 28, 52);
  ctx.font = "400 24px Segoe UI, sans-serif";
  ctx.fillText(info.key, 28, 86);
  ctx.font = "400 32px Segoe UI, sans-serif";
  if (!names.length) ctx.fillText("Sin clientes cargados", 28, 150);
  names.slice(0, 14).forEach((item, i) => {
    const name = String(item.name || item).replace(/^\d+[\.\)\-]\s*/, "");
    const kg = item.kg != null ? item.kg + " kg" : "";
    const money = item.total != null ? "$" + Number(item.total).toLocaleString("es-MX") : "";
    ctx.fillText((i + 1) + ". " + name, 28, 150 + i * 50);
    ctx.font = "400 24px Segoe UI, sans-serif";
    ctx.fillText([kg, money].filter(Boolean).join("   "), 56, 174 + i * 50);
    ctx.font = "400 32px Segoe UI, sans-serif";
  });
  boardTex.needsUpdate = true;
  const box = document.getElementById("pedidos");
  const cap = document.getElementById("pedidos-cap");

}

function makeLabel(text) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 160;
  const ctx = c.getContext("2d");
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.7, 0.53, 1);
  sprite.userData = { ctx, tex, c };
  paintLabel(sprite, text, "");
  return sprite;
}
function paintLabel(sprite, name, role) {
  const { ctx, tex, c } = sprite.userData;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = "rgba(28,25,21,0.82)";
  roundRect(ctx, 16, 18, 480, 124, 28);
  ctx.fill();
  ctx.fillStyle = "#f4efe6";
  ctx.font = "700 48px Segoe UI, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(String(name || "Bot").slice(0, 16), 256, 72);
  ctx.font = "400 26px Segoe UI, sans-serif";
  ctx.fillStyle = "#e7d3b0";
  ctx.fillText(String(role || "").slice(0, 32), 256, 112);
  tex.needsUpdate = true;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

  for (let n = names.length - 1; n > 0; n--) {
    const j = Math.floor(Math.random() * (n + 1));
    const tmp = names[n];
    names[n] = names[j];
    names[j] = tmp;
  }
  const acts = ["sleep", "play", "chat", "drink", "freezer", "count"];
  const map = {};
  names.forEach(name => { map[name] = acts[Math.floor(Math.random() * acts.length)]; });

    names.slice(0, pingCount).forEach(name => { map[name] = "ping"; });
  }
  restPlan = { at: t, key: key, map: map };

}

function keepOut(pos, radius) {
  pos.x = Math.max(-7.35, Math.min(7.35, pos.x));
  pos.z = Math.max(-6.35, Math.min(6.35, pos.z));
  solids.forEach(s => {
    const dx = pos.x - s.x;
    const dz = pos.z - s.z;
    const hx = s.hx + radius;
    const hz = s.hz + radius;
    if (Math.abs(dx) < hx && Math.abs(dz) < hz) {
      const ox = hx - Math.abs(dx);
      const oz = hz - Math.abs(dz);
      if (ox < oz) pos.x += dx < 0 ? -ox : ox;
      else pos.z += dz < 0 ? -oz : oz;
    }
  });
}

let audioCtx = null;
function audio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep() {
  const ctx = audio();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine";
  o.frequency.value = 520;
  g.gain.setValueAtTime(0.0001, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.4);
}
function approvalTone() {
  const ctx = audio();
  [660, 880].forEach((freq, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    const start = ctx.currentTime + i * 0.18;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(0.4, start + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(start);
    o.stop(start + 0.3);
  });
}

function ensureVoices() {
  const ctx = audio();
  if (voices) return voices;
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 500;
  filter.Q.value = 0.8;
  const gain = ctx.createGain();
  gain.gain.value = 0;
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  noise.start();
  voices = { ctx, gain, filter };
  return voices;
}

  v.gain.gain.setTargetAtTime(on ? 0.08 * syllable : 0, v.ctx.currentTime, 0.08);
  if (!on) return;
  v.filter.frequency.setTargetAtTime(380 + syllable * 420, v.ctx.currentTime, 0.08);
}

  } else if (skyMode === "cloud") {
    a.filter.frequency.setTargetAtTime(420, a.ctx.currentTime, 0.4);
    a.gain.gain.setTargetAtTime(0.07 + Math.sin(t * 0.3) * 0.03, a.ctx.currentTime, 0.4);
  } else {
    a.gain.gain.setTargetAtTime(0.015, a.ctx.currentTime, 0.4);
    if (t > a.nextBird) {
      a.nextBird = t + 1.4 + Math.random() * 2.2;
      const o = a.ctx.createOscillator();
      const g = a.ctx.createGain();
      o.type = "sine";
      o.frequency.value = 1400 + Math.random() * 900;
      g.gain.setValueAtTime(0.0001, a.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.08, a.ctx.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, a.ctx.currentTime + 0.22);
      o.connect(g);
      g.connect(a.ctx.destination);
      o.start();
      o.stop(a.ctx.currentTime + 0.24);
    }
  }
}
function tap(freq, dur, gainValue) {
  if (!weatherAudio) return;
  const ctx = weatherAudio.ctx;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(freq, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.45), ctx.currentTime + dur);
  g.gain.setValueAtTime(gainValue, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + dur);
}
function kick() {
  if (!weatherAudio) return;
  const ctx = weatherAudio.ctx;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(180, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.12);
  g.gain.setValueAtTime(0.28, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.16);
}
let lastKick = 0;
let lastPing = 0;
let lastCount = 0;
function countBurst() {
  if (!weatherAudio) return;
  for (let i = 0; i < 14; i++) setTimeout(() => tap(900 + (i % 3) * 80, 0.025, 0.06), i * 28);
}
function unlockVoice() {
  startWeatherAudio();
  if (!window.speechSynthesis) return;
  voiceOn = true;
  window.speechSynthesis.getVoices();
  window.speechSynthesis.resume();
  currentUtter = new SpeechSynthesisUtterance("Listo");
  currentUtter.lang = "es-MX";
  currentUtter.volume = 1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(currentUtter);
  const btn = document.getElementById("voz-btn");
  if (btn) btn.textContent = "Voz on";
}
document.getElementById("voz-btn").onclick = unlockVoice;
function speakNear(bot) {
  const textToSay = String(bot.task || "").trim();
  if (!voiceOn || !textToSay || !window.speechSynthesis) return;
  if (spoken[bot.name] === textToSay) return;
  spoken[bot.name] = textToSay;
  if (window.speechSynthesis.paused) window.speechSynthesis.resume();
  window.speechSynthesis.cancel();
  currentUtter = new SpeechSynthesisUtterance(textToSay);
  currentUtter.lang = "es-MX";
  currentUtter.volume = 1;
  const tune = voiceTune[String(bot.name).toLowerCase()] || { pitch: 1, rate: 1 };
  currentUtter.pitch = tune.pitch;
  currentUtter.rate = tune.rate;
  const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("es"));
  const male = voices.find(v => /pablo|jorge|diego|juan|carlos|raul|enrique|male|hombre/i.test(v.name));
  if (male) currentUtter.voice = male;
  else if (voices.length) currentUtter.voice = voices[0];
  window.speechSynthesis.speak(currentUtter);
}
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const nowParts = new Intl.DateTimeFormat("en-GB", { timeZone: "America/Mexico_City", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const hh = Number(nowParts.find(p => p.type === "hour").value) + Number(nowParts.find(p => p.type === "minute").value) / 60;
  let day = 1;
  if (hh < sunriseHour - 0.5 || hh > sunsetHour + 0.5) day = 0;
  else if (hh < sunriseHour + 0.4) day = (hh - (sunriseHour - 0.5)) / 0.9;
  else if (hh > sunsetHour - 0.4) day = (sunsetHour + 0.5 - hh) / 0.9;
  day = Math.max(0, Math.min(1, day));
  const nightNow = day < 0.35;
  if (nightNow !== isNight) { isNight = nightNow; paintSky(skyMode, t); }
  if (!isNight && Math.floor(t * 8) !== Math.floor((t - 0.016) * 8)) paintSky(skyMode, t);
  sun.intensity = 0.12 + day * weatherDim * 1.15;
  lamps.forEach(item => { if (item.isLight) item.intensity = (1 - day) * 14; else item.material.opacity = (1 - day) * 0.22; });
  lampMat.emissiveIntensity = (1 - day) * 0.8;
  fill.intensity = 0.2 + (1 - day) * 0.35;
  updateWeatherAudio(t);
  const playing = actors.some(a => a.pose === "play");
  const pinging = actors.some(a => a.pose === "ping");
  if (playing && Math.abs(Math.sin(t * 3)) < 0.12 && t - lastKick > 0.4) { lastKick = t; kick(); }
  const counting = actors.some(a => a.pose === "count");
  bills.forEach((bill, i) => {
    bill.visible = counting;
    if (!counting) return;
    const cycle = (t * 0.7 + i * 0.18) % 1;
    const fall = Math.min(1, cycle * 1.4);
    bill.position.set(-3.15 + Math.sin(i) * 0.08, 1.02 - fall * 0.9, -5.85 + fall * 0.55);
    bill.rotation.x = -0.4 + fall * 1.2;
    bill.rotation.z = (i - 3) * 0.15;
  });
  if (counting && t - lastCount > 0.55) { lastCount = t; countBurst(); }
  if (pinging && Math.abs(Math.sin(t * 2.2)) > 0.96 && t - lastPing > 0.28) { lastPing = t; tap(880, 0.06, 0.08); }
  if (rain.visible) rain.children.forEach(drop => {
    drop.position.y -= drop.userData.speed;
    if (drop.position.y < 0.4) drop.position.y = 6;
  });
  const forward = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0) - joy.y;
  const strafe = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0) + joy.x;
  if (forward || strafe) focus = null;
  yaw -= lookJoy.x * 0.03;
  pitch = Math.max(0.25, Math.min(1.15, pitch + lookJoy.y * 0.02));
  const lookX = Math.sin(yaw);
  const lookZ = Math.cos(yaw);
  const rightX = lookZ;
  const rightZ = -lookX;
  const speed = 0.12;
  roam.x += (lookX * forward + rightX * strafe) * speed;
  roam.z += (lookZ * forward + rightZ * strafe) * speed;
  keepOut(roam, 0.35);
  const camTarget = focus ? focus.person.position.clone() : new THREE.Vector3(roam.x, 1.1, roam.z);
  camTarget.y = 1.1;
  camera.position.x = camTarget.x + Math.sin(yaw) * dist * Math.cos(pitch * 0.35);
  camera.position.z = camTarget.z + Math.cos(yaw) * dist * Math.cos(pitch * 0.35);
  camera.position.y = 1.4 + dist * Math.sin(pitch) * 0.45;
  camera.lookAt(camTarget);

  actors.forEach((a, i) => {
    const status = a.bot.status;
    const limbs = a.person.userData.limbs;
    const home = a.home;
    let tx = home.x, tz = home.z, trot = home.rot;
    let emoji = "💻", show = true;
    let pose = "stand";
    if (status === "trabajando") { trot = home.rot + Math.PI; pose = "sit"; }
    if (status === "caminando") {
      const ang = t * 0.45 + a.phase;
      tx = Math.cos(ang) * 2.4;
      tz = Math.sin(ang) * 1.6;
      trot = ang + Math.PI / 2;
      emoji = "🚶";
    } else if (status === "hablando") {
      tx = (i % 2 === 0 ? -0.7 : 0.7);
      tz = 0.15;
      trot = i % 2 === 0 ? 0.4 : -0.4;
      emoji = "💬";
    } else if (status === "descanso") {
      const resting = actors.filter(x => x.bot.status === "descanso" && x.bot.name !== "Sin conectar");
      const plan = planRest(resting, t);
      const mode = plan[a.bot.name] || "chat";
      const same = resting.filter(x => plan[x.bot.name] === mode);
      const si = Math.max(0, same.indexOf(a));
      if (mode === "ping") {
        const count = same.length;
        const side = count <= 2 ? (si === 0 ? -1 : 1) : (si < 2 ? -1 : 1);
        const lane = count <= 2 ? 0 : (si % 2 === 0 ? -0.42 : 0.42);
        tx = lane;
        tz = 0.4 + side * 1.75;
        trot = side < 0 ? 0 : Math.PI;
        emoji = "🏓";
        pose = "ping";
        const ballZ = 0.4 + Math.sin(t * 2.2) * 0.95;
        pingBall.position.set(Math.sin(t * 2.2) * 0.25, 0.95 + Math.abs(Math.cos(t * 2.2)) * 0.18, ballZ);
      } else if (mode === "sleep") {
        tx = -1.2 + si * 1.3; tz = 2.4; trot = Math.PI; emoji = "💤"; pose = "sleep";
      } else if (mode === "play") {
        const ang = t * 1.3 + si * 2.1;
        tx = 4.2 + Math.cos(ang) * (1.05 + si * 0.35);
        tz = 3.4 + Math.sin(ang) * 0.8;
        trot = ang + Math.PI / 2;
        emoji = "⚽";
        pose = "play";
        officeBall.position.x = 4.2 + Math.cos(ang + 0.8) * 0.55;
        officeBall.position.z = 3.4 + Math.sin(ang + 0.8) * 0.4;
        officeBall.position.y = 0.18 + Math.abs(Math.sin(t * 3)) * 0.25;
      } else if (mode === "count") {
        tx = -3.15;
        tz = -5.25;
        trot = Math.PI;
        emoji = "💵";
        pose = "count";
      } else if (mode === "freezer") {
        tx = -5.85;
        tz = -5.15 + (si - 0.5) * 0.45;
        trot = Math.atan2(-5.8 - tx, -6.15 - tz);
        emoji = "🧊";
        pose = "freezer";
      } else if (mode === "drink") {
        const ang = t * 0.35 + si * 1.7;
        tx = 5.7 + Math.cos(ang) * 0.7;
        tz = 3.15 + Math.sin(ang) * 0.55;
        const mate = same.find(x => x !== a);
        if (mate) trot = Math.atan2(mate.person.position.x - tx, mate.person.position.z - tz);
        else trot = Math.atan2(7.2 - tx, 4.4 - tz);
        emoji = "🥤";
        pose = "drink";
      } else {
        const ang = si * (Math.PI * 2 / Math.max(same.length, 1));
        tx = -3.4 + Math.cos(ang) * 0.7;
        tz = 4.3 + Math.sin(ang) * 0.55;
        trot = Math.atan2(-Math.cos(ang), -Math.sin(ang));
        emoji = "😄";
        pose = "chat";
      }
    } else if (status === "pensando") {
      emoji = "💡";
    } else if (status === "esperando") {
      emoji = "✋";
    }
    if (pose !== "ping") {
      tx += ((i % 2) - 0.5) * 0.15;
      tz += (i - 1.5) * 0.12;
    }
    a.person.position.x += (tx - a.person.position.x) * 0.04;
    a.person.position.z += (tz - a.person.position.z) * 0.04;
    const dy = trot - a.person.rotation.y;
    a.person.rotation.y += Math.atan2(Math.sin(dy), Math.cos(dy)) * 0.08;

    const moving = Math.hypot(tx - a.person.position.x, tz - a.person.position.z) > 0.08 || status === "caminando";
    const swing = moving ? Math.sin(t * 7 + a.phase) * 0.55 : Math.sin(t * 1.5 + a.phase) * 0.08;
    a.person.rotation.z += (0 - a.person.rotation.z) * 0.2;
    if (pose === "sleep") {
      limbs.legL.rotation.x = 1.2; limbs.legR.rotation.x = 1.2;
      limbs.armL.rotation.x = -0.4; limbs.armR.rotation.x = -0.4;
      limbs.body.rotation.x = 1.15;
      a.person.position.y = 0.15;
    } else { limbs.body.rotation.x += (0 - limbs.body.rotation.x) * 0.2; }
    if (pose === "play") {
      limbs.legL.rotation.x = Math.sin(t * 8) * 0.9;
      limbs.legR.rotation.x = -Math.sin(t * 8) * 0.9;
      limbs.armL.rotation.x = -1.2; limbs.armR.rotation.x = -0.3;
      a.person.position.y = Math.abs(Math.sin(t * 6 + a.phase)) * 0.2;
    } else if (pose === "drink") {
      limbs.legL.rotation.x = Math.sin(t * 4 + i) * 0.35;
      limbs.legR.rotation.x = -Math.sin(t * 4 + i) * 0.35;
      limbs.armR.rotation.x = -1.3;
      limbs.armL.rotation.x = -0.3 + Math.sin(t * 2 + i) * 0.3;
      a.person.position.y = 0;
    } else if (pose === "chat") {
      limbs.legL.rotation.x = 0; limbs.legR.rotation.x = 0;
      limbs.armL.rotation.x = -0.5 + Math.sin(t * 3 + i) * 0.45;
      limbs.armR.rotation.x = -0.8;
      a.person.position.y = 0;
    } else if (pose === "sit") {
      limbs.legL.rotation.x = 1.45;
      limbs.legR.rotation.x = 1.45;
      limbs.armL.rotation.x = -0.8 + Math.sin(t * 8 + i) * 0.25;
      limbs.armR.rotation.x = -0.8 + Math.sin(t * 8 + i + 1) * 0.25;
      limbs.body.rotation.x = 0.12;
      a.person.position.y = 0.42;
      if (desks[i] && desks[i].chair) desks[i].chair.rotation.y += (Math.PI - desks[i].chair.rotation.y) * 0.12;
    } else {
      limbs.legL.rotation.x = swing;
      limbs.legR.rotation.x = -swing;
      limbs.armL.rotation.x = -swing * 0.7;
      limbs.armR.rotation.x = swing * 0.7;
      a.person.position.y = moving ? Math.abs(Math.sin(t * 7 + a.phase)) * 0.04 : 0;
      if (desks[i] && desks[i].chair) desks[i].chair.rotation.y += (0.4 - desks[i].chair.rotation.y) * 0.08;
    }
    a.pose = pose;
    if (a.handCan) a.handCan.visible = pose === "drink";
    paintBubble(a.bubble, emoji, show);
    a.bubble.position.y = 1.62 + Math.sin(t * 2 + i) * 0.04;
  });
  for (let i = 0; i < actors.length; i++) {
    for (let j = i + 1; j < actors.length; j++) {
      const pa = actors[i].person.position;
      const pb = actors[j].person.position;
      let dx = pa.x - pb.x;
      let dz = pa.z - pb.z;
      let dist2 = Math.hypot(dx, dz);
      const min = 1.05;
      if (dist2 < min) {
        if (dist2 < 0.001) { dx = 0.4; dz = 0.2; dist2 = Math.hypot(dx, dz); }
        const push = (min - dist2) * 0.5;
        pa.x += dx / dist2 * push;
        pa.z += dz / dist2 * push;
        pb.x -= dx / dist2 * push;
        pb.z -= dz / dist2 * push;
      }
    }
  }
  actors.forEach(a => keepOut(a.person.position, 0.28));
  const freezerOpen = actors.some(a => a.pose === "freezer");
  const lidTarget = freezerOpen ? -1.15 : 0;
  lidL.rotation.x += (lidTarget - lidL.rotation.x) * 0.08;
  lidR.rotation.x += (lidTarget - lidR.rotation.x) * 0.08;
  if (freezerOpen) {
    packCount += 0.012;
    if (packCount >= boxes.length) {
      packCount = 0;
      packOut = !packOut;
    }
  }
  boxes.forEach((box, i) => {
    const moved = packOut ? i < packCount : i >= boxes.length - packCount;
    const onTable = packOut ? moved : !moved;
    const target = onTable
      ? new THREE.Vector3(-4.9, 0.92 + i * 0.3, -6.15)
      : new THREE.Vector3(-6.85, 0.55, -6.15);
    box.position.lerp(target, freezerOpen ? 0.06 : 0);
  });
  actors.forEach((a, i) => { if (a.bot.status === "esperando") paintScreen(i, Math.sin(t * 5) > 0); });
  setMurmur(actors.filter(a => a.pose === "chat").length >= 2, t);
  renderer.render(scene, camera);
}
animate();
